{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/kiosk.css') }}">
{% endblock %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTU FACE — Kiosk Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
</head>
<body>
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas-capture"></canvas>
    </div>
    <!-- Overlay Dot Matrix / Grid -->
    <div class="overlay"></div>
    <div class="cyber-grid"></div>

    <!-- Header -->
    <div class="hud-header">
        <div class="hud-brand">
            <img src="/static/img/logo_MTU.png" onerror="this.style.display='none'">
            <div>
                <div class="hud-title">MTUFACE KIOSK</div>
                <div class="hud-badges">
                    <span class="hb hb-system"><i class="fas fa-circle me-1" style="font-size:5px"></i>System Active</span>
                    <span class="hb hb-shield"><i class="fas fa-shield-halved me-1"></i>Anti-Fraud</span>
                </div>
            </div>
        </div>
        <div class="hud-stats d-none d-md-flex">
            <div class="hs-item">
                <div class="hs-label">Local Time</div>
                <div class="hs-value" id="clock">--:--:--</div>
            </div>
            <div class="hs-divider"></div>
            <div class="hs-item">
                <div class="hs-label">Recognized</div>
                <div class="hs-value"><span id="stat-count">0</span></div>
            </div>
        </div>
    </div>

    <!-- Scanner -->
    <div id="scanner-frame">
        <div class="frame-glow"></div>
        <div class="sf-corner sf-tl"></div>
        <div class="sf-corner sf-tr"></div>
        <div class="sf-corner sf-bl"></div>
        <div class="sf-corner sf-br"></div>
        <div id="scan-line"></div>
    </div>

    <!-- Result -->
    <div id="result-panel">
        <div class="d-flex align-items-center gap-3 position-relative" style="z-index:1">
            <img id="res-avatar" src="" class="res-avatar" onerror="this.src='/static/img/truong-xay-dung-mien-tay.jpg'">
            <div class="flex-grow-1">
                <div id="res-status" class="res-badge res-badge-ok"><i class="fas fa-shield-check"></i> Access Granted</div>
                <div id="res-name" class="res-name">—</div>
                <div id="res-mssv" class="res-mssv">MSSV: —</div>
                <div id="res-msg" class="res-msg">—</div>
            </div>
        </div>
    </div>

    <!-- Logs -->
    <div class="logs-panel d-none d-lg-flex">
        <div class="logs-header">
            <span><span class="pulse"></span> Live Feed</span>
        </div>
        <div id="log-container">
            <div class="log-item text-center py-5 d-block" style="color:rgba(255,255,255,.2)">
                <i class="fas fa-fingerprint d-block fs-1 mb-3"></i>
                Đang chờ nhận diện...
            </div>
        </div>
    </div>

    <div class="hud-footer">MTUFACE · "Trí tuệ xây dựng — Công nghệ tương lai"</div>

    
</body>
</html>

{% block extra_js %}
<script src="{{ url_for('static', filename='js/pages/kiosk.js') }}"></script>
{% endblock %}
