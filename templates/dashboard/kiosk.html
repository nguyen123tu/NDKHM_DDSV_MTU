<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTU FACE - Kiosk Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --bg-dark: #0a0e17;
            --glass-bg: rgba(15, 23, 42, 0.7);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Roboto', sans-serif;
            color: white;
        }

        /* Video Background */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect */
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(10, 14, 23, 0.6) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* HUD Scanner Frame */
        #scanner-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 400px;
            border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 40px;
            z-index: 3;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.1);
        }

        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid var(--neon-blue);
            z-index: 4;
        }

        .top-left { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 30px; }
        .top-right { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-top-right-radius: 30px; }
        .bottom-left { bottom: -2px; left: -2px; border-right: 0; border-top: 0; border-bottom-left-radius: 30px; }
        .bottom-right { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 30px; }

        /* Scanning Line */
        #scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            top: 0;
            animation: scan 3s linear infinite;
            z-index: 5;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Header HUD */
        .hud-header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(to right, #00d2ff, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .hud-stats {
            background: var(--glass-bg);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
        }

        /* Result Panel */
        #result-panel {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
            background: var(--glass-bg);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            z-index: 10;
            display: none;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .student-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--neon-blue);
            object-fit: cover;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-success { background: rgba(57, 255, 20, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .status-error { background: rgba(255, 49, 49, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }

        /* Real-time Logs Sidebar */
        .logs-sidebar {
            position: fixed;
            right: 20px;
            top: 100px;
            width: 300px;
            height: 75%;
            background: var(--glass-bg);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            z-index: 10;
            overflow-y: auto;
        }

        .log-item {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Branding Slogan */
        .hud-slogan {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-style: italic;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            z-index: 10;
        }

        #canvas-capture { display: none; }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas-capture"></canvas>
    </div>

    <div class="overlay"></div>

    <!-- HUD Header -->
    <div class="hud-header">
        <div class="d-flex align-items-center">
            <img src="/static/img/logo_MTU.png" height="50" class="me-3" onerror="this.src='/static/img/truong-xay-dung-mien-tay.jpg'">
            <div>
                <h3 class="hud-title mb-0">MTU FACE KIOSK</h3>
                <div class="d-flex gap-2">
                    <span class="badge bg-primary px-2 rounded-pill" style="font-size: 0.6rem;">SYSTEM ACTIVE</span>
                    <span class="badge bg-danger px-2 rounded-pill" style="font-size: 0.6rem;"><i class="fas fa-shield-halved me-1"></i> ANTI-FRAUD ACTIVE</span>
                </div>
            </div>
        </div>
        <div class="hud-stats d-none d-md-flex align-items-center gap-4">
            <div>
                <small class="d-block text-white-50" style="font-size: 0.6rem;">LOCAL TIME</small>
                <strong id="clock" style="font-family: 'Orbitron'; color: var(--neon-blue);">00:00:00</strong>
            </div>
            <div class="vr" style="background-color: rgba(255,255,255,0.2);"></div>
            <div>
                <small class="d-block text-white-50" style="font-size: 0.6rem;">ATTENDANCE</small>
                <strong style="font-family: 'Orbitron';"><span id="stat-count">0</span> RECOGNIZED</strong>
            </div>
        </div>
    </div>

    <!-- Scanner Frame -->
    <div id="scanner-frame">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
        <div id="scan-line"></div>
    </div>

    <!-- Result Panel -->
    <div id="result-panel">
        <div class="d-flex align-items-center gap-4">
            <img id="res-avatar" src="" class="student-avatar" onerror="this.src='/static/img/truong-xay-dung-mien-tay.jpg'">
            <div class="flex-grow-1">
                <div id="res-status" class="status-badge status-success mb-2">ACCESS GRANTED</div>
                <h4 id="res-name" class="mb-1 fw-bold">NGUYỄN VĂN A</h4>
                <div id="res-mssv" class="text-white-50 small mb-2 text-uppercase">MSSV: 20012345</div>
                <div id="res-msg" class="text-info small fw-light">Đã ghi nhận điểm danh & lưu ảnh bằng chứng hệ thống.</div>
            </div>
        </div>
    </div>

    <!-- Sidebar Logs -->
    <div class="logs-sidebar d-none d-lg-block">
        <div class="mb-3 border-bottom border-secondary pb-3 d-flex justify-content-between align-items-center">
            <span class="fw-bold text-uppercase" style="font-family: 'Orbitron'; font-size: 0.8rem; letter-spacing: 1px;">
                <i class="fas fa-satellite-dish me-2 text-info"></i> Live Feed
            </span>
            <div class="spinner-grow spinner-grow-sm text-info" role="status"></div>
        </div>
        <div id="log-container">
            <div class="log-item text-muted text-center py-5">
                <i class="fas fa-fingerprint d-block fs-1 mb-3 opacity-25"></i>
                Chưa có dữ liệu nhận diện
            </div>
        </div>
    </div>

    <div class="hud-slogan">MTU FACE: "TRÍ TUỆ XÂY DỰNG - CÔNG NGHỆ TƯƠNG LAI"</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('vi-VN', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Webcam setup
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas-capture');
        const context = canvas.getContext('2d');

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Webcam Error:", err.name, err.message);
                if (err.name === 'NotAllowedError') {
                    alert("Bạn cần cấp quyền truy cập Camera cho trình duyệt để sử dụng Kiosk.");
                }
            }
        }

        // Processing Logic
        let isProcessing = false;
        let lastRecognizedMssv = null;
        let lastRecognizedTime = 0;

        async function captureAndRecognize() {
            if (isProcessing) return;
            
            // Draw current frame to canvas
            if (video.videoWidth === 0) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            
            isProcessing = true;
            try {
                const response = await fetch('/public/api/recognize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                });
                
                if (!response.ok) throw new Error("Server response 404 or Error");
                
                const res = await response.json();
                if (res.success) {
                    const now = Date.now();
                    // Ngăn chặn nhận diện lặp lại cùng một người trong vòng 10s
                    if (res.student.mssv !== lastRecognizedMssv || (now - lastRecognizedTime > 10000)) {
                        showResult(res);
                        lastRecognizedMssv = res.student.mssv;
                        lastRecognizedTime = now;
                    }
                }
            } catch (err) {
                console.error("API Error:", err);
            } finally {
                // Thử nhận diện lại mỗi 2 giây
                setTimeout(() => { isProcessing = false; }, 2000);
            }
        }

        function showResult(data) {
            const panel = document.getElementById('result-panel');
            const student = data.student;
            const att = data.attendance;

            document.getElementById('res-name').innerText = student.ho_ten;
            document.getElementById('res-mssv').innerText = `MSSV: ${student.mssv}`;
            document.getElementById('res-avatar').src = student.avatar ? `/${student.avatar}` : '/static/img/truong-xay-dung-mien-tay.jpg';
            document.getElementById('res-msg').innerText = att ? (att.msg || "Điểm danh hoàn tất") : "Nhận diện thành công";
            
            // Hiệu ứng âm thanh khi thành công
            try { new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3').play(); } catch(e){}

            panel.style.display = 'block';
            addLog(student);

            // Tự động ẩn sau 5 giây
            setTimeout(() => {
                panel.style.display = 'none';
            }, 5000);
        }

        function addLog(student) {
            const container = document.getElementById('log-container');
            const now = new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `
                <div class="text-info fw-bold" style="font-family: Orbitron; font-size: 0.7rem;">${now}</div>
                <div class="flex-grow-1">
                    <div class="fw-bold text-uppercase" style="font-size: 0.8rem;">${student.ho_ten}</div>
                    <div class="text-white-50" style="font-size: 0.7rem;">${student.mssv}</div>
                </div>
                <div class="text-success"><i class="fas fa-check-circle"></i></div>
            `;
            
            if (container.children[0].classList.contains('text-muted')) {
                container.innerHTML = '';
            }
            
            container.prepend(item);
            
            // Giới hạn 15 bản ghi gần nhất
            if (container.children.length > 15) {
                container.removeChild(container.lastChild);
            }

            // Tăng số lượng thống kê session
            const statSpan = document.getElementById('stat-count');
            statSpan.innerText = parseInt(statSpan.innerText) + 1;
        }

        // Start Camera and Auto-Process
        setupCamera().then(() => {
            setInterval(captureAndRecognize, 2000);
        });

    </script>
</body>
</html>
