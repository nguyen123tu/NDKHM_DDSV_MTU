{% extends "base.html" %}

{% block title %}Thêm Sinh Viên Mới{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('students.list_students') }}" class="btn btn-outline-secondary border-0 p-2 me-3 text-muted hover-text-dark">
                <i class="fas fa-arrow-left fs-5"></i>
            </a>
            <h3 class="fw-bold m-0"><i class="fas fa-user-plus text-secondary me-2"></i> Thêm Sinh Viên</h3>
        </div>

        <div class="flat-card border-0 shadow-sm bg-white rounded-3 p-4 mb-4">
            <form method="POST" action="{{ url_for('students.add') }}" enctype="multipart/form-data">
                <div class="row g-4 mb-4">
                    <!-- Ảnh đại diện -->
                    <div class="col-md-4 text-center">
                        <div class="mb-3 position-relative">
                            <div class="bg-light border border-secondary border-opacity-50 rounded-circle overflow-hidden mx-auto d-flex align-items-center justify-content-center" style="width: 150px; height: 150px; border-style: dashed !important;" id="avatarPreviewContainer">
                                <i class="fas fa-camera fs-1 text-muted" id="avatarIcon"></i>
                                <img src="" id="avatarPreview" class="d-none w-100 h-100" style="object-fit: cover;">
                            </div>
                            <div class="mt-3">
                                <label for="avatar" class="btn btn-sm btn-outline-secondary">
                                    <i class="fas fa-upload me-1"></i> Chọn Ảnh (Mặt chuẩn)
                                </label>
                                <input type="file" id="avatar" name="avatar" class="d-none" accept="image/png, image/jpeg" onchange="previewImage(this);">
                                <div class="form-text text-muted mt-2 small">
                                    Ảnh này sẽ được dùng cho AI Training. Hãy chọn ảnh rõ mặt thẳng.
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Form thông tin -->
                    <div class="col-md-8">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Mã Sinh Viên (MSSV) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control border-light shadow-sm bg-white text-dark" name="mssv" required placeholder="Ví dụ: 22D14801030074">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Họ và Tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control border-light shadow-sm bg-white text-dark" name="ho_ten" required placeholder="Nguyễn Văn A">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Chọn lớp sinh hoạt</label>
                            <select class="form-select border-light shadow-sm bg-white text-dark" name="lop_id">
                                <option value="">-- Chọn một lớp --</option>
                                {% for lop in classes %}
                                <option value="{{ lop.id }}">{{ lop.ma_lop }} - {{ lop.ten_lop }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold text-uppercase">Ngày sinh</label>
                                <input type="date" class="form-control border-light shadow-sm bg-white text-dark" name="ngay_sinh">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold text-uppercase d-block">Giới tính</label>
                                <div class="d-flex h-100 align-items-center">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input bg-light border-secondary" type="radio" name="gioi_tinh" id="nam" value="1" checked>
                                        <label class="form-check-label text-light" for="nam">Nam</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input bg-light border-secondary" type="radio" name="gioi_tinh" id="nu" value="0">
                                        <label class="form-check-label text-light" for="nu">Nữ</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold text-uppercase">Số điện thoại</label>
                                <input type="text" class="form-control border-light shadow-sm bg-white text-dark" name="sdt" placeholder="0901234567">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold text-uppercase">Email liên hệ</label>
                                <input type="email" class="form-control border-light shadow-sm bg-white text-dark" name="email" placeholder="student@mtu.edu.vn">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-end pt-3 border-top border-secondary border-opacity-50">
                    <a href="{{ url_for('students.list_students') }}" class="btn btn-outline-light me-2">Hủy bỏ</a>
                    <button type="submit" class="btn btn btn-primary shadow-sm">
                        <i class="fas fa-save me-1"></i> Lưu Sinh Viên
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>


{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/pages/students_add.js') }}"></script>
{% endblock %}
