{% extends "base.html" %}

{% block title %}Sửa Thông Tin Sinh Viên{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('students.detail', id=student.id) }}" class="btn btn-outline-secondary border-0 p-2 me-3 text-muted hover-text-dark">
                <i class="fas fa-arrow-left fs-5"></i>
            </a>
            <h3 class="fw-bold m-0"><i class="fas fa-user-edit text-secondary me-2"></i> Chỉnh Sửa Thông Tin Sinh Viên</h3>
        </div>

        <div class="flat-card border-0 shadow-sm bg-white rounded-3 p-4 mb-4">
            <form method="POST" action="{{ url_for('students.edit', id=student.id) }}" enctype="multipart/form-data">
                <div class="row g-4 mb-4">
                    <!-- Ảnh đại diện -->
                    <div class="col-md-4 text-center">
                        <div class="mb-3 position-relative">
                            <div class="bg-light border border-secondary border-opacity-50 rounded-circle overflow-hidden mx-auto d-flex align-items-center justify-content-center" style="width: 150px; height: 150px; border-style: dashed !important;">
                                <!-- Nếu đã có ảnh thì hiện luôn -->
                                {% if student.avatar %}
                                <img src="{{ url_for('serve_database_file', filename=student.avatar) }}" id="avatarPreview" class="w-100 h-100" style="object-fit: cover;">
                                {% else %}
                                <i class="fas fa-camera fs-1 text-muted" id="avatarIcon"></i>
                                <img src="" id="avatarPreview" class="d-none w-100 h-100" style="object-fit: cover;">
                                {% endif %}
                            </div>
                            <div class="mt-3">
                                <label for="avatar" class="btn btn-sm btn-outline-secondary">
                                    <i class="fas fa-upload me-1"></i> Đổi Ảnh Đại Diện
                                </label>
                                <input type="file" id="avatar" name="avatar" class="d-none" accept="image/png, image/jpeg" onchange="previewImage(this);">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Form thông tin -->
                    <div class="col-md-8">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Mã Sinh Viên (MSSV) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control border-light shadow-sm bg-white text-dark bg-light border-secondary" value="{{ student.mssv }}" readonly disabled>
                            <div class="small text-muted mt-1">Không thể thay đổi mã sinh viên sau khi tạo.</div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Họ và Tên <span class="text-danger">*</span></label>
                            <input type="text" class="form-control border-light shadow-sm bg-white text-dark" name="ho_ten" required value="{{ student.ho_ten }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Chọn lớp sinh hoạt</label>
                            <select class="form-select border-light shadow-sm bg-white text-dark" name="lop_id">
                                <option value="">-- Chọn một lớp --</option>
                                {% for lop in classes %}
                                <option value="{{ lop.id }}" {% if student.lop_id == lop.id %}selected{% endif %}>{{ lop.ma_lop }} - {{ lop.ten_lop }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold text-uppercase">Ngày sinh</label>
                                <input type="date" class="form-control border-light shadow-sm bg-white text-dark" name="ngay_sinh" value="{{ student.ngay_sinh }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold text-uppercase d-block">Giới tính</label>
                                <div class="d-flex h-100 align-items-center">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input bg-light border-secondary" type="radio" name="gioi_tinh" id="nam" value="1" {% if student.gioi_tinh == 1 %}checked{% endif %}>
                                        <label class="form-check-label text-light" for="nam">Nam</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input bg-light border-secondary" type="radio" name="gioi_tinh" id="nu" value="0" {% if student.gioi_tinh == 0 %}checked{% endif %}>
                                        <label class="form-check-label text-light" for="nu">Nữ</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold text-uppercase">Số điện thoại</label>
                                <input type="text" class="form-control border-light shadow-sm bg-white text-dark" name="sdt" value="{{ student.sdt or '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold text-uppercase">Email liên hệ</label>
                                <input type="email" class="form-control border-light shadow-sm bg-white text-dark" name="email" value="{{ student.email or '' }}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-end pt-3 border-top border-secondary border-opacity-50">
                    <a href="{{ url_for('students.detail', id=student.id) }}" class="btn btn-outline-light me-2">Hủy bỏ</a>
                    <button type="submit" class="btn btn-glass-warning">
                        <i class="fas fa-save me-1"></i> Cập Nhật Thay Đổi
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('avatarPreview').src = e.target.result;
            document.getElementById('avatarPreview').classList.remove('d-none');
            const icon = document.getElementById('avatarIcon');
            if (icon) icon.classList.add('d-none');
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
<style>
    .btn-glass-warning {
        background: rgba(245, 158, 11, 0.2);
        color: #fcd34d;
        border: 1px solid rgba(245, 158, 11, 0.4);
        backdrop-filter: blur(4px);
    }
    .btn-glass-warning:hover {
        background: rgba(245, 158, 11, 0.4);
        color: #fff;
    }
</style>
{% endblock %}
