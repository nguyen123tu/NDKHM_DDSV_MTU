# ============================================================
# Docker Compose: Hệ Thống Điểm Danh Nhận Diện Khuôn Mặt
# Bao gồm: App (Flask) + Database (MS SQL Server) + Nginx
# ============================================================
# CÁCH DÙNG:
#   Chạy lần đầu:  docker compose up -d --build
#   Xem logs:       docker compose logs -f app
#   Dừng:           docker compose down
#   Khởi tạo DB:    docker compose exec app python -c "from db.connection import init_database; init_database()"
# ============================================================

services:
  # ──── MS SQL Server 2022 Express (Miễn phí) ────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: face_attendance_db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-MTUFace@2026}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${DB_PASSWORD:-MTUFace@2026}" -Q "SELECT 1" -C -b
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - face_net

  # ──── Flask Application (AI + WebSocket) ────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: face_attendance_app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-mtu_docker_secret_2026}
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=${DB_NAME:-face_attendance_db}
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD:-MTUFace@2026}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.55}
      - MOTION_THRESHOLD=${MOTION_THRESHOLD:-3000}
      - ALERT_COOLDOWN=${ALERT_COOLDOWN:-20}
      - DB_LOG_COOLDOWN=${DB_LOG_COOLDOWN:-28800}
      - AI_ENGINE=${AI_ENGINE:-insightface}
      - AI_CHATBOT_LLM=${AI_CHATBOT_LLM:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./database:/app/database      # Ảnh sinh viên — persist
      - ./models:/app/models           # File AI models pkl — persist
    depends_on:
      db:
        condition: service_healthy
    networks:
      - face_net

  # ──── Nginx Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: face_attendance_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - face_net

volumes:
  mssql_data:
    driver: local

networks:
  face_net:
    driver: bridge
