# ============================================================
# Nginx Reverse Proxy — MTUFace Attendance System
# Chuyển tiếp request từ port 80 → Flask app port 5001
# Hỗ trợ WebSocket cho Socket.IO
# ============================================================

upstream flask_app {
    server app:5001;
}

server {
    listen 80;
    server_name _;

    # Cho phép upload ảnh khuôn mặt (tối đa 50MB)
    client_max_body_size 50M;

    # Timeout dài hơn cho các request AI xử lý lâu
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    # ─── Main App ─────────────────────────────────────────────
    location / {
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket cho Socket.IO ──────────────────────────────
    location /socket.io/ {
        proxy_pass http://flask_app/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;  # 24h cho WebSocket persistent connection
    }

    # ─── Static Files (cache để giảm tải Flask) ───────────────
    location /static/ {
        proxy_pass http://flask_app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
