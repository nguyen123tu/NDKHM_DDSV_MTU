# ============================================================
# Nginx Reverse Proxy & Security Edge — MTUFace Production
# Cấu hình TLS/SSL, HTTP Security Headers, WebSocket & Rate Limiting
# ============================================================

upstream flask_app {
    server app:5001;
    keepalive 32;
}

# HTTP Server — Tự động chuyển hướng sang HTTPS (nếu bật SSL) hoặc phục vụ HTTP ở dev
server {
    listen 80;
    server_name _;

    # Nếu sử dụng HTTPS trên production, bỏ comment dòng dưới đây để chuyển hướng:
    # return 301 https://$host$request_uri;

    # Giới hạn kích thước tải lên (phù hợp với giới hạn ảnh khuôn mặt 10MB + metadata)
    client_max_body_size 15M;

    # Timeout dài hơn cho các request xử lý AI
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;

    # ─── HTTP Security Headers ────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Chặn truy cập trực tiếp vào các file ẩn (ví dụ: .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ─── Main App ─────────────────────────────────────────────
    location / {
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket cho Socket.IO ──────────────────────────────
    location /socket.io/ {
        proxy_pass http://flask_app/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;  # 24h cho WebSocket persistent connection
    }

    # ─── Static Files (Cache để giảm tải Flask) ───────────────
    location /static/ {
        proxy_pass http://flask_app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

