name: face_attendance_app
description: A new Flutter project for Face Recognition Attendance System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  camera: ^0.10.5+9
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  image_picker: ^1.2.1
  sqflite: ^2.4.2
  connectivity_plus: ^7.1.1
  uuid: ^4.5.3
  google_mlkit_face_detection: ^0.13.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  geolocator: ^13.0.0
  fl_chart: ^0.70.2
  glassmorphism_ui: ^0.3.0
  crypto: ^3.0.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_markdown: ^0.7.4+3
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  local_auth: ^3.0.1
  flutter_image_compress: ^2.4.0

  path: any
  image: ^4.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
